---
# cPanel → Git™ Version Control → "Deploy HEAD Commit" copies the site into public_html.
# Files that live only on the server (config/config.php, storage/, uploads/) are never deleted:
# rsync runs without --delete, and the repo holds only placeholders for those folders.
deployment:
  tasks:
    - export DEPLOYPATH=/home/georgemu/public_html/
    - /bin/rsync -a --exclude=.git --exclude=.cpanel.yml --exclude=.gitignore ./ $DEPLOYPATH
    - /bin/mkdir -p ${DEPLOYPATH}storage/logs ${DEPLOYPATH}storage/draws ${DEPLOYPATH}uploads/media ${DEPLOYPATH}uploads/entrants
